<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solfège en 30 jours</title>
<meta name="theme-color" content="#12343B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}

:root{
  --paper:#EAF0EF; --card:#FFFFFF; --ink:#12343B; --soft:#4F6C72; --line:#C5D3D2; --staff:#7E979B;
  --brass:#DFA20F; --brass-deep:#B37E00; --ok:#187A50; --ok-bg:#DDF2E7; --no:#B93A28; --no-bg:#FBE3DE;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D2126; --card:#15323A; --ink:#E7F1EF; --soft:#9FB9B8; --line:#2B4A52; --staff:#6F8E93;
    --brass:#F0B93A; --brass-deep:#F0B93A; --ok:#55CC93; --ok-bg:#143F31; --no:#F58A76; --no-bg:#4A211B;
  }
}
:root[data-theme="dark"]{
  --paper:#0D2126; --card:#15323A; --ink:#E7F1EF; --soft:#9FB9B8; --line:#2B4A52; --staff:#6F8E93;
  --brass:#F0B93A; --brass-deep:#F0B93A; --ok:#55CC93; --ok-bg:#143F31; --no:#F58A76; --no-bg:#4A211B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:2.5rem;font-weight:700}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .9em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.lede{color:var(--soft);margin:.5rem 0 1.2rem}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:12px 18px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:1.05rem;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn + .btn{margin-top:10px}
.btn small{display:block;font-weight:500;opacity:.8;font-size:.85rem}
.link{background:none;border:0;padding:10px 0;color:var(--soft);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 18px}
.meter i{display:block;height:100%;background:var(--brass);border-radius:8px;transition:width .3s}

.week{margin-top:26px}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week header span{color:var(--soft);font-size:.9rem;font-weight:600;white-space:nowrap}
.score{background:var(--card);border-radius:18px;padding:6px 4px 2px;margin-top:10px}
.week details{margin-top:6px}
.week summary{color:var(--soft);font-weight:600;font-size:.95rem;padding:10px 4px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;min-height:52px}
.row b{font-family:var(--display);width:1.8em;flex:none;color:var(--soft)}
.row span{flex:1}
.row em{font-style:normal;font-weight:700;font-size:.9rem;color:var(--ok)}

svg.staff{display:block;width:100%;height:auto;max-width:440px;margin:0 auto}
.sl{stroke:var(--staff);stroke-width:1}
.it{color:var(--ink)}
.it.done{color:var(--brass)}
.it.hl{color:var(--brass-deep)}
.gl,.nh{fill:currentColor}
.ho{fill:none;stroke:currentColor;stroke-width:1.9}
.st{stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.lb{font:600 11.5px var(--body);fill:var(--soft);text-anchor:middle}
.it.next .lb{fill:var(--ink);font-weight:700}
.ts{font:700 25px Georgia,"Times New Roman",serif;fill:var(--ink);text-anchor:middle}
.qm{font:700 26px var(--display);fill:var(--brass-deep);text-anchor:middle}
.ring{fill:none;stroke:var(--brass);stroke-width:2}
g[data-act]{cursor:pointer}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 14px}
.back{background:none;border:0;padding:10px 10px 10px 0;font-weight:700;color:var(--soft);min-height:44px}
.tag{font-weight:700;color:var(--brass-deep)}
.lesson{margin-top:16px}
.lesson figure{margin:14px 0 18px;background:var(--card);border-radius:16px;padding:10px 6px}
.lesson figcaption{font-size:.9rem;color:var(--soft);text-align:center;padding:2px 10px 6px}
.lesson ul{padding-left:1.1em;margin:0 0 .9em}
.lesson li{margin-bottom:.35em}
.tip{border-left:4px solid var(--brass);padding:4px 0 4px 12px;margin:0 0 1em}
.sticky{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-top:20px}

.qhead{font-size:.95rem;font-weight:600;color:var(--soft)}
.qtext{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.2;margin:10px 0 12px}
.figbox{background:var(--card);border-radius:18px;padding:10px 6px;margin-bottom:14px}
.choices{display:grid;gap:10px}
.choices.c4{grid-template-columns:repeat(4,1fr)}
.choices.c2{grid-template-columns:repeat(2,1fr)}
.choice{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.05rem;padding:8px 10px;line-height:1.25}
.choice:disabled{cursor:default;opacity:.55}
.choice.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);opacity:1}
.choice.bad{border-color:var(--no);background:var(--no-bg);color:var(--no);opacity:1}
.choice svg.staff{max-width:300px}
.fb{min-height:64px;margin-top:14px}
.fb p{font-weight:600;margin-bottom:10px}
.fb .y{color:var(--ok)} .fb .n{color:var(--no)}
.listen{margin-bottom:14px}
.hint{font-size:.88rem;color:var(--soft);margin-top:-6px}

.big{font-family:var(--display);font-weight:700;font-size:4.2rem;line-height:1;margin:18px 0 6px}
.big small{font-size:1.4rem;color:var(--soft)}

.card{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:16px;margin-top:10px;min-height:64px}
.card b{display:block;font-family:var(--display);font-size:1.1rem}
.card span{color:var(--soft);font-size:.92rem}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{display:flex;width:100%;max-width:540px}
.tabs button{flex:1;background:none;border:0;min-height:58px;font-weight:700;color:var(--soft);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--brass)}
.tabs[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.kbd{position:relative;display:flex;height:158px;margin-top:4px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kbd.static{height:104px;margin:6px 8px 4px}
.wk{flex:1;min-width:0;margin:0;padding:0 0 8px;background:#FBFCFC;border:1.5px solid #12343B;border-right-width:0;border-radius:0 0 7px 7px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;color:#12343B;font-weight:700;font-size:.72rem;line-height:1}
.wk.last{border-right-width:1.5px}
.wk i{width:9px;height:9px;border-radius:50%;background:#DFA20F}
.bk{position:absolute;top:0;height:60%;margin:0;padding:0;background:#12343B;border:0;border-radius:0 0 5px 5px}
.wk.hl{background:#F8E2A6}.bk.hl{background:#C98F00}
.wk.good{background:#BFE8D2}.bk.good{background:#1E9462}
.wk.bad{background:#F6C4BB}.bk.bad{background:#C9432F}
.dots{letter-spacing:.3em;text-align:center;font-size:1.2rem;color:var(--brass-deep);margin:0 0 8px}
.rev{margin:0 0 -4px;font-size:.92rem}
.plan{background:var(--card);border-radius:14px;padding:12px 14px;margin:18px 0 0}
.plan b{display:block;font-family:var(--display);margin-bottom:2px}
.plan span{display:block;color:var(--soft);font-size:.92rem}
.plan + .lede{margin-top:12px}
.plan + .btn{margin-top:14px}
.beats{display:flex;gap:12px;justify-content:center;margin:4px 0 12px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--brass)}
.pad{display:block;width:100%;min-height:150px;border-radius:18px;border:2px solid var(--ink);background:var(--card);font-family:var(--display);font-size:1.6rem;font-weight:700;padding:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad small{display:block;font:500 .85rem/1.35 var(--body);color:var(--soft);margin-top:8px}
.pad.hit{background:var(--brass)}
.pad:disabled{opacity:.55}

.steps{display:flex;gap:6px;margin:8px 0 4px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--brass)}
.navrow{display:flex;gap:10px;margin-top:20px}
.navrow .btn{margin-top:0}
.navrow .btn.ghost{flex:0 0 36%}
.lesson p{font-size:1.08rem}
.mini{display:block;margin:2px auto 8px;min-height:44px;padding:8px 20px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700}
.xname{text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;margin:6px 0 8px}
.explore .figbox{margin-bottom:4px}
.plan span b{display:inline;font-family:var(--body);color:var(--ink);margin-right:8px}
.it.dim{opacity:.5}
#sstaff g.mv{animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(46px)}to{transform:none}}
.shead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 10px}
.seg{display:flex;gap:8px;margin:8px 0 18px}
.seg button{flex:1;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;padding:6px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.card.feat{border:2px solid var(--brass)}
@media (prefers-reduced-motion: reduce){#sstaff g.mv{animation:none}}
</style>
</head>

/* ---------- outils ---------- */
const NAMES=['Do','Ré','Mi','Fa','Sol','La','Si'];
const mod=(n,m)=>((n%m)+m)%m;
const nameOf=d=>NAMES[mod(d,7)];
const semis=d=>[0,2,4,5,7,9,11][mod(d,7)]+12*Math.floor(d/7);
const fS=s=>261.63*Math.pow(2,s/12);
const freq=(d,acc=0)=>fS(semis(d)+acc);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- son ---------- */
let AC=null;
function ac(){ if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C();} if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t,dur,vol){
  const c=ac(); if(!c)return; vol=vol||0.22;
  const g=c.createGain(); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [['triangle',1,1],['sine',2,0.25]].forEach(([type,m,v])=>{const o=c.createOscillator(),og=c.createGain();o.type=type;o.frequency.value=f*m;og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.05);});
}
function click(t,strong){
  const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type='square'; o.frequency.value=strong?1500:1000;
  g.gain.setValueAtTime(strong?0.12:0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.06);
}
const now=()=>{const c=ac();return c?c.currentTime+0.08:0;};
function playSeq(fs,gap,dur){const t=now();fs.forEach((f,i)=>tone(f,t+i*gap,dur||0.8));}

/* ---------- figures rythmiques ---------- */
const BEATS={w:4,h:2,q:1,e:.5,s:.25};
const T=tok=>({dur:tok[0],dot:tok.includes('.'),rest:tok.includes('r')});
const beatsOf=it=>BEATS[it.dur]*(it.dot?1.5:1);
function beamify(items){
  for(let i=0;i<items.length-1;i++){const a=items[i],b=items[i+1];
    if(a.dur==='e'&&b.dur==='e'&&!a.rest&&!b.rest&&!a.beam&&!b.beam){a.beam='start';b.beam='end';i++;}}
  return items;
}
const R=toks=>beamify(toks.map(T));
function playRhythm(toks,beats){
  const c=ac(); if(!c)return; const bt=60/84; let t=now(); beats=beats||4;
  for(let i=0;i<beats;i++)click(t+i*bt,i===0);
  t+=beats*bt; for(let i=0;i<beats;i++)click(t+i*bt,false);
  toks.map(T).forEach(it=>{const b=beatsOf(it); if(!it.rest)tone(freq(5),t,Math.max(0.18,b*bt*0.92),0.25); t+=b*bt;});
}

function staff(o){

      const step=it.step!==undefined?it.step:(it.d!==undefined?it.d-base:3), y=100-step*5, dur=it.dur||'q', up=step<4;

      for(let k=10;k<=step;k+=2)g+=`<line class="st" x1="${X-11}" x2="${X+11}" y1="${100-k*5}" y2="${100-k*5}"/>`;
      if(it.ring)g+=`<circle class="ring" cx="${X}" cy="${y}" r="12"/>`;

      else if(dur==='h')g+=`<ellipse class="ho" cx="${X}" cy="${y}" rx="5.6" ry="3.7" transform="rotate(-22 ${X} ${y})"/>`;

function kbd(o){
  const n=o.hi-o.lo+1, mark=o.mark||{}, live=!!o.live, tag=live?'button':'div';
  let h=`<div class="kbd${live||o.big?'':' static'}">`;
  for(let d=o.lo;d<=o.hi;d++){
    const s=semis(d), lab=(o.labels==='all'||(o.labels==='do'&&mod(d,7)===0))?nameOf(d):'';
    h+=`<${tag} class="wk ${d===o.hi?'last ':''}${mark[s]||''}" ${live?`data-act="${o.act||'key'}" data-s="${s}" aria-label="${nameOf(d)}"`:''}>${d===0?'<i></i>':''}<span>${lab}</span></${tag}>`;
  }
  for(let d=o.lo;d<o.hi;d++){

  }

}

function withChoices(correct,others,max){
  const set=shuffle([...new Set(others.filter(x=>x!==correct))]).slice(0,(max||4)-1);
  const ch=shuffle([correct,...set]); return {choices:ch,a:ch.indexOf(correct)};
}
function melody(pool,len,steps){
  const lo=Math.min(...pool),hi=Math.max(...pool); let d=pool.includes(0)&&steps.start0?0:pick(pool); const out=[d];
  while(out.length<len){ let nx,guard=0; do{nx=d+pick(steps.moves);guard++;}while((nx<lo||nx>hi||nx===d)&&guard<40); if(nx<lo||nx>hi)nx=d>lo?d-1:d+1; d=nx; out.push(d); }
  return out;
}
function makeQ(spec){
  switch(spec.type){
  case 'mix':{ const bag=[]; spec.parts.forEach(p=>{for(let i=0;i<(p.w||1);i++)bag.push(p);}); return makeQ(pick(bag)); }
  case 'qcm':{

    const base={fig:staff({clef,center:true,items:[{d}],alt:'Une note sur la portée'}),why:`C'est un ${nameOf(d)} (${posName(step)}).`,rk:{type:'notes',clef,pool:[d],kb}};
    if(spec.input==='name'||(spec.input!=='kbd'&&Math.random()<0.3))

    const nm=nameOf(d)+(acc===1?' dièse':acc===-1?' bémol':'');
    return {q:`Touchez ${acc?'':'un '}${nm}.`,kbd:{lo,hi,labels:'none'},target:semis(d)+acc,targetMod:true,

    return {q:'Jouez ces notes dans l\'ordre.',fig:staff({clef,center:true,gap:46,items:seq.map(d=>({d})),alt:'Une courte mélodie'}),kbd:{lo:r[0],hi:r[1],labels:spec.labels||'do'},seq:seq.map(semis),seqNames:seq.map(nameOf)};
  }
  case 'dictee':{
    const seq=melody(range(0,spec.max||4),spec.len||3,{moves:spec.moves||[-1,1],start0:true});
    return {q:`Rejouez les ${seq.length} notes entendues. La première est un Do.`,play:()=>playSeq(seq.map(d=>freq(d)),0.62,0.6),kbd:{lo:0,hi:7,labels:'all'},seq:seq.map(semis),seqNames:seq.map(nameOf)};
  }
  case 'duree':{
    const tok=pick(spec.pool), f=FIG[tok], it=T(tok), fig=staff({clef:null,center:true,items:[it],alt:'Une figure de rythme'}), rk={type:'duree',pool:[tok]};
    if(Math.random()<0.5){
      const c=withChoices(BEATLB[f[1]],Object.values(BEATLB),4);
      return {q:it.rest?'Combien de temps dure ce silence ?':'Combien de temps dure cette note ?',fig,choices:c.choices,a:c.a,cols:2,why:`C'est ${f[2]} ${f[0]} : ${BEATLB[f[1]]}.`,rk};
    }
    const c=withChoices(f[0],spec.pool.map(t=>FIG[t][0]).concat(['noire','blanche','croche','ronde']),4);

      why:`On compte ${size} noms de notes en partant de ${nameOf(root)} : ${range(root,d2).map(nameOf).join(', ')}. La ${nm} est ${nameOf(d2)}.`,

/* ---------- oreille : progression quotidienne ---------- */
const O=pool=>({type:'oreille',pool});
const DI=(len,max,moves,w)=>({type:'dictee',len,max,moves,w});
function earSpec(d){
  if(d<=2)return {type:'haut',min:3};
  if(d<=4)return {type:'haut',min:1};
  if(d<=6)return O([0,4]);
  if(d<=9)return O([0,2,4]);
  if(d<=10)return O([0,1,2,3,4]);
  if(d<=13)return {type:'mix',parts:[Object.assign(O([0,1,2,3,4]),{w:2}),{type:'rythme'}]};
  if(d<=17)return {type:'mix',parts:[DI(3,4,[-1,1],2),{type:'rythme'}]};
  if(d<=20)return {type:'mix',parts:[O(range(0,7)),DI(3,4,[-2,-1,1,2])]};
  if(d<=23)return {type:'mix',parts:[DI(4,4,[-2,-1,1,2],2),{type:'rythme'}]};
  if(d===24)return {type:'mix',parts:[{type:'intervO'},DI(4,4,[-2,-1,1,2])]};
  if(d<=26)return {type:'mix',parts:[{type:'intervO'},{type:'accord'},DI(4,7,[-2,-1,1,2])]};
  return {type:'mix',parts:[DI(4,7,[-2,-1,1,2],2),{type:'accord'},{type:'intervO'},{type:'rythme'}]};
}

/* ---------- le programme ---------- */
const SOL=range(0,12), FA=range(-10,0), FA1=range(-7,0);
const DUR1=['w','h','q'], DUR2=['w','h','q','e','s'], SIL=['wr','hr','qr','er'], DUR3=['h.','q.','w','h','q','e'];
const two=(a,b)=>`<figure>${a}${b}</figure>`;
const DAYS=[
{t:'La portée, la clé de sol et le clavier',ex:{type:'mix',parts:[{type:'qcm',qs:Q.portee},{type:'touche',lo:0,hi:7,w:2}]},l:()=>`
<p>La musique s'écrit sur une <b>portée</b> : cinq lignes et quatre interlignes, comptés de bas en haut. Plus une note est haute, plus elle est aiguë.</p>
<figure>${staff({alt:'Portée avec clé de sol'})}<figcaption>La portée, avec la clé de sol au début : c'est la clé de la main droite.</figcaption></figure>
<p>Il n'existe que sept noms de notes, qui se répètent : Do, Ré, Mi, Fa, Sol, La, Si, puis de nouveau Do. Au piano, ce sont les touches blanches.</p>
<figure>${kfig(0,7)}<figcaption>Le point doré marque le Do du milieu, votre repère pendant tout le programme.</figcaption></figure>
<p class="tip">Les touches noires vont par groupes de deux et de trois. Le Do est toujours la blanche juste à gauche d'un groupe de deux.</p>`},
{t:'Do, Ré, Mi',ex:{type:'notes',pool:[0,1,2],kb:[0,7],labels:'all'},l:()=>`
<p>Le Do du milieu s'écrit sous la portée, sur une petite ligne rien que pour lui. Le Ré se colle sous la 1re ligne. Le Mi est posé sur la 1re ligne.</p>
<figure>${notesFig('sol',[0,1,2],{center:true})}${kfig(0,7,[0,1,2])}<figcaption>Trois notes qui se suivent sur la portée, trois touches voisines sur le clavier.</figcaption></figure>
<p>Main droite : le pouce (doigt 1) sur Do, l'index (2) sur Ré, le majeur (3) sur Mi.</p>
<p class="tip">Dans l'exercice, vous répondez le plus souvent en touchant la bonne touche. C'est le geste du pianiste : voir une note, trouver sa touche.</p>`},
{t:'Fa et Sol : la position de Do',ex:{type:'mix',parts:[{type:'notes',pool:range(0,4),kb:[0,7],labels:'all',w:2},{type:'melo',pool:range(0,4),len:3,labels:'all'}]},l:()=>`
<p>On continue de monter : Fa dans le 1er interligne, Sol sur la 2e ligne. La clé de sol s'enroule justement autour de cette ligne.</p>
<figure>${notesFig('sol',range(0,4),{center:true})}${kfig(0,7,range(0,4))}<figcaption>Do, Ré, Mi, Fa, Sol : une note par doigt.</figcaption></figure>
<p>C'est la <b>position de Do</b>, la première que l'on apprend au piano : les cinq doigts de la main droite posés sur cinq touches voisines, du pouce (1) sur Do au petit doigt (5) sur Sol.</p>
<p>Nouveau : on vous demandera aussi de jouer plusieurs notes à la suite, comme une petite mélodie.</p>`},
{t:'La, Si, Do',ex:{type:'mix',parts:[{type:'notes',pool:range(0,7),w:3},{type:'melo',pool:range(0,7),len:3}]},l:()=>`
<p>La dans le 2e interligne, Si sur la 3e ligne, puis un nouveau Do dans le 3e interligne. Du Do du milieu à ce Do, il y a huit notes : une <b>octave</b>.</p>
<figure>${notesFig('sol',range(0,7),{gap:34})}${kfig(0,7,range(0,7))}<figcaption>Les huit notes de Do à Do.</figcaption></figure>
<p class="tip">Les notes alternent toujours ligne, interligne, ligne. Deux notes qui se touchent sur la portée sont deux touches voisines.</p>
<p>À partir d'aujourd'hui, le clavier n'affiche plus que les Do. À vous de retrouver les autres.</p>`},
{t:'Les notes aiguës',ex:{type:'mix',parts:[{type:'notes',pool:range(5,12),w:3},{type:'melo',pool:range(4,9),len:3}]},l:()=>`
<p>Au-dessus du Do aigu, on recommence : Ré, Mi, Fa, Sol, La, de plus en plus à droite sur le clavier.</p>
<figure>${notesFig('sol',range(7,12),{center:true})}${kfig(3,12,range(7,12))}<figcaption>Do (3e interligne), Ré (4e ligne), Mi, Fa (5e ligne), Sol, puis La sur une ligne supplémentaire.</figcaption></figure>
<p>À partir de la 3e ligne, la hampe (le trait de la note) descend au lieu de monter. C'est seulement pour la lisibilité : la note ne change pas.</p>`},
{t:'Toute la clé de sol',ex:{type:'mix',parts:[{type:'notes',pool:SOL,w:3},{type:'melo',pool:range(2,10),len:3}]},n:12,l:()=>`
<p>Deux listes à savoir par cœur suffisent pour lire vite.</p>
<figure>${notesFig('sol',[2,4,6,8,10],{center:true})}<figcaption>Les lignes, de bas en haut : Mi, Sol, Si, Ré, Fa.</figcaption></figure>
<figure>${notesFig('sol',[3,5,7,9],{center:true})}<figcaption>Les interlignes : Fa, La, Do, Mi.</figcaption></figure>
<p class="tip">Récitez-les à voix haute chaque jour cette semaine. L'échauffement vous reposera automatiquement les notes que vous ratez.</p>`},
{t:'Bilan : lire et jouer',ex:{type:'mix',parts:[{type:'notes',pool:SOL,w:2},{type:'melo',pool:range(0,7),len:4,w:2},{type:'touche',lo:0,hi:7}]},n:12,l:()=>`
<p>Pour déchiffrer une mélodie, les pianistes ne lisent pas chaque note séparément. Ils repèrent la première, puis suivent le dessin.</p>
<ul><li>La note suivante monte ou descend ?</li><li>D'un cran (touche voisine) ou d'un saut (on enjambe une touche) ?</li></ul>
<figure>${staff({center:true,gap:46,items:[0,1,2,4].map(d=>({d,label:nameOf(d)})),alt:'Do Ré Mi Sol'})}<figcaption>Do, un cran, un cran, puis un saut par-dessus Fa.</figcaption></figure>
<p>Le bilan d'aujourd'hui mélange lecture, mélodies à jouer et repérage des touches.</p>`},
{t:'La pulsation : ronde, blanche, noire',ex:{type:'mix',parts:[{type:'duree',pool:DUR1},{type:'tap',level:1}]},l:()=>`
<p>La <b>pulsation</b> est le battement régulier de la musique, celui que l'on tape du pied. On l'appelle le <b>temps</b>. La forme d'une note indique combien de temps elle dure.</p>
<figure>${rhyFig(['w','h','q'],['Ronde : 4','Blanche : 2','Noire : 1'],{center:true,gap:90})}<figcaption>Chaque figure vaut la moitié de la précédente.</figcaption></figure>
<p>Nouveau : vous allez <b>taper des rythmes</b>. Le métronome donne quatre clics de départ, puis vous tapez sur l'écran pendant qu'il continue. Une frappe par note ; pour une blanche, vous tapez une fois et vous attendez deux temps.</p>
<p class="tip">Comptez « 1, 2, 3, 4 » à voix haute avec le métronome. C'est l'habitude la plus utile au piano.</p>`},
{t:'Croches et doubles croches',ex:{type:'mix',parts:[{type:'duree',pool:DUR2},{type:'tap',level:2}]},l:()=>`
<p>On continue de diviser par deux. La <b>croche</b> vaut un demi-temps : il en faut deux pour une noire. La <b>double croche</b> vaut un quart de temps.</p>
<figure>${rhyFig(['e','s'],['Croche : ½','Double : ¼'],{center:true,gap:110})}<figcaption>Un crochet pour la croche, deux pour la double croche.</figcaption></figure>
<figure>${rhyFig(['e','e','e','e'],['1','et','2','et'],{center:true})}<figcaption>Quand elles se suivent, les croches sont reliées par une barre.</figcaption></figure>
<p class="tip">Comptez « 1 et 2 et 3 et 4 et » : les chiffres tombent sur les clics, les « et » entre deux clics.</p>`},
{t:'Les silences',ex:{type:'mix',parts:[{type:'duree',pool:SIL.concat(['q','h']),w:2},{type:'tap',level:3}]},l:()=>`
<p>En musique, se taire s'écrit aussi. Chaque note a son silence de même durée.</p>
<figure>${rhyFig(['wr','hr','qr','er'],['Pause','Demi-pause','Soupir','Demi-soupir'],{center:true,gap:74})}<figcaption>Pause : 4 temps. Demi-pause : 2. Soupir : 1. Demi-soupir : ½.</figcaption></figure>
<p class="tip">La pause est accrochée sous la 4e ligne, la demi-pause est posée sur la 3e. La plus longue est celle qui « pend ».</p>
<p>Quand vous tapez un rythme, un silence se compte dans la tête, sans frapper.</p>`},
{t:'La mesure',ex:{type:'mix',parts:[{type:'mesure',w:2},{type:'tap',level:3}]},l:()=>`
<p>Les temps sont regroupés en <b>mesures</b>, séparées par des barres verticales. Deux chiffres au début de la portée donnent la règle du jeu.</p>
<figure>${staff({clef:null,time:[4,4],items:(()=>{const a=R(['q','q','h','h','e','e','q']);a[2].barAfter=true;return a;})(),gap:38,alt:'Deux mesures à quatre temps'})}<figcaption>Deux mesures à 4 temps. Chacune contient exactement 4 temps.</figcaption></figure>
<ul><li>Le chiffre du haut : le nombre de temps par mesure.</li><li>Le chiffre du bas : la note qui vaut un temps (4 = la noire).</li></ul>
<p>4/4 est la mesure la plus courante, 3/4 celle de la valse, 2/4 celle de la marche.</p>`},
{t:'La clé de fa : la main gauche',ex:{type:'mix',parts:[{type:'notes',clef:'fa',pool:range(-4,0),labels:'all',w:3},{type:'melo',clef:'fa',pool:range(-4,0),len:3,labels:'all'}]},l:()=>`
<p>Au piano, la main gauche joue les sons graves, écrits en <b>clé de fa</b>. Ses deux points encadrent la 4e ligne : c'est là que se trouve le Fa.</p>
<figure>${notesFig('fa',[0,-1,-2,-3,-4],{center:true})}${kfig(-4,3,range(-4,0))}<figcaption>En descendant depuis le Do du milieu : Do, Si, La, Sol, Fa.</figcaption></figure>
<p>Le Do du milieu est le même que celui de la main droite. En clé de fa, il s'écrit au-dessus de la portée, sur une ligne supplémentaire.</p>
<p class="tip">Main gauche : le pouce (1) sur le Do du milieu, puis un doigt par touche en descendant, jusqu'au petit doigt (5) sur Fa.</p>`},
{t:'La clé de fa : de Do à Do',ex:{type:'mix',parts:[{type:'notes',clef:'fa',pool:FA1,w:3},{type:'melo',clef:'fa',pool:FA1,len:3}]},l:()=>`
<p>Descendons d'une octave entière sous le Do du milieu.</p>
<figure>${notesFig('fa',FA1,{gap:34})}${kfig(-7,0,FA1)}<figcaption>De Do grave (2e interligne) au Do du milieu.</figcaption></figure>
<p>Position de Do à la main gauche : le petit doigt (5) sur le Do grave, le pouce (1) sur Sol.</p>
<p class="tip">Attention au piège : une note placée au même endroit n'a pas le même nom dans les deux clés. Regardez toujours la clé avant la note.</p>`},
{t:'Le point et la liaison',ex:{type:'mix',parts:[{type:'duree',pool:DUR3},{type:'mesure'},{type:'tap',level:4}]},l:()=>`
<p>Un <b>point</b> placé après une note lui ajoute la moitié de sa durée.</p>
<figure>${rhyFig(['h.','q.'],['2 + 1 = 3 temps','1 + ½ = 1 temps ½'],{center:true,gap:148})}<figcaption>Blanche pointée et noire pointée.</figcaption></figure>
<p>La <b>liaison</b> est une courbe qui relie deux notes de même hauteur : on ne joue que la première, et on la tient pendant la durée des deux.</p>
<p class="tip">Noire pointée suivie d'une croche : comptez « 1 (et) 2 <b>et</b> », la croche tombe sur le « et » du 2.</p>`},
{t:'Bilan : deux mains, deux clés',ex:{type:'mix',parts:[{type:'notes',pool:SOL,w:2},{type:'notes',clef:'fa',pool:FA1,w:2},{type:'melo',pool:range(0,7),len:4},{type:'duree',pool:DUR2.concat(SIL)},{type:'mesure'},{type:'tap',level:4,w:2}]},n:12,l:()=>`
<p>Mi-parcours. Vous lisez la clé de sol, le début de la clé de fa, et vous savez taper un rythme en mesure : c'est déjà de quoi déchiffrer une mélodie simple au piano.</p>
<p>Ce bilan mélange tout. Si une famille de questions vous résiste, repassez par l'entraînement libre avant de continuer.</p>`},
{t:'Toute la clé de fa et la grande portée',ex:{type:'mix',parts:[{type:'notes',clef:'fa',pool:FA,w:3},{type:'notes',pool:SOL},{type:'melo',clef:'fa',pool:range(-10,-3),len:3}]},n:12,l:()=>`
<figure>${notesFig('fa',[-10,-8,-6,-4,-2],{center:true})}<figcaption>Les lignes : Sol, Si, Ré, Fa, La.</figcaption></figure>
<figure>${notesFig('fa',[-9,-7,-5,-3],{center:true})}<figcaption>Les interlignes : La, Do, Mi, Sol.</figcaption></figure>
<p>Une partition de piano superpose deux portées reliées par une accolade : c'est la <b>grande portée</b>. En haut, la clé de sol pour la main droite. En bas, la clé de fa pour la main gauche. Le Do du milieu se trouve exactement entre les deux.</p>
<figure>${staff({center:true,items:[{d:0,label:'Do'}],alt:'Do du milieu en clé de sol'})}${staff({clef:'fa',center:true,items:[{d:0,label:'Do'}],alt:'Do du milieu en clé de fa'})}<figcaption>La même touche, écrite pour chaque main.</figcaption></figure>`},
{t:'Tons et demi-tons',ex:{type:'mix',parts:[{type:'qcm',qs:Q.tons,w:2},{type:'touche',lo:0,hi:7}]},l:()=>`
<p>Le <b>demi-ton</b> est la plus petite distance entre deux notes : au piano, c'est la distance entre deux touches voisines, noires comprises. Un <b>ton</b> vaut deux demi-tons.</p>
<figure>${kfig(0,7)}<figcaption>Pas de touche noire entre Mi et Fa, ni entre Si et Do.</figcaption></figure>
<p>Entre deux touches blanches voisines, il y a un ton quand une noire les sépare, et seulement un demi-ton entre Mi–Fa et Si–Do.</p>`},
{t:'Dièse, bémol, bécarre',ex:{type:'mix',parts:[{type:'alter',w:2},{type:'touche',lo:0,hi:7,black:true}]},l:()=>`
<p>Les <b>altérations</b> modifient une note d'un demi-ton. Elles s'écrivent juste devant la note, à la même hauteur.</p>
<figure>${staff({center:true,gap:80,items:[{d:3,acc:1,label:'Fa dièse'},{d:6,acc:-1,label:'Si bémol'},{d:6,acc:0,label:'Si bécarre'}],alt:'Trois notes altérées'})}${kfig(0,7,[{s:6},{s:10}])}<figcaption>Fa dièse : la noire à droite du Fa. Si bémol : la noire à gauche du Si.</figcaption></figure>
<p>Le dièse monte à la touche immédiatement à droite, le bémol descend à la touche immédiatement à gauche, le bécarre annule. Une même touche noire porte donc deux noms : Fa dièse est aussi Sol bémol.</p>
<p>Une altération reste valable jusqu'à la fin de la mesure.</p>`},
{t:'La gamme de Do majeur',ex:{type:'mix',parts:[{type:'qcm',qs:Q.gamme,w:3},{type:'melo',pool:range(0,7),len:4}]},l:()=>`
<p>Une <b>gamme</b> est une suite de huit notes, de la tonique à la même note une octave plus haut. La gamme majeure suit toujours le même chemin : ton, ton, demi-ton, ton, ton, ton, demi-ton.</p>
<figure>${notesFig('sol',range(0,7),{gap:34})}<figcaption>Do majeur : uniquement des touches blanches.</figcaption></figure>
<p>Chaque note a un rôle. Le 1er degré est la <b>tonique</b>, le 5e la <b>dominante</b>, le 7e la <b>sensible</b>, qui « veut » remonter vers la tonique.</p>
<p>Pour garder ce chemin en partant de Sol, il faut un Fa dièse. En partant de Fa, un Si bémol.</p>`},
{t:'L\'armure : les dièses',ex:{type:'armure',kind:'#'},l:()=>`
<p>Plutôt que de répéter les altérations devant chaque note, on les écrit une fois pour toutes après la clé : c'est l'<b>armure</b>. Elle vaut pour tout le morceau. Les dièses arrivent toujours dans le même ordre.</p>
<p class="tip">Fa, Do, Sol, Ré, La, Mi, Si.</p>
<figure>${staff({key:{t:'#',n:2},alt:'Armure à deux dièses'})}<figcaption>Deux dièses : tous les Fa et tous les Do se jouent sur la touche noire.</figcaption></figure>
<p>Pour trouver la tonalité majeure : prenez le dernier dièse et montez d'un demi-ton. Ici, Do dièse, donc Ré majeur.</p>`},
{t:'L\'armure : les bémols',ex:{type:'mix',parts:[{type:'armure',kind:'b',w:2},{type:'armure',kind:'#'}]},l:()=>`
<p>Les bémols suivent l'ordre inverse des dièses.</p>
<p class="tip">Si, Mi, La, Ré, Sol, Do, Fa.</p>
<figure>${staff({key:{t:'b',n:3},alt:'Armure à trois bémols'})}<figcaption>Trois bémols : Si, Mi, La.</figcaption></figure>
<p>La tonalité majeure porte le nom de l'avant-dernier bémol. Ici, Mi bémol majeur. Seule exception à retenir : un seul bémol, c'est Fa majeur.</p>`},
{t:'Tempo et nuances',ex:{type:'mix',parts:[{type:'qcm',qs:Q.tempo,w:3},{type:'tap',level:4}]},l:()=>`
<p>Le <b>tempo</b> est la vitesse de la pulsation. On l'indique par un mot italien ou par un nombre de battements par minute.</p>
<ul><li>Adagio : lent.</li><li>Moderato : modéré.</li><li>Allegro : rapide et vif.</li></ul>
<p>Les <b>nuances</b> indiquent la force du son, du plus doux au plus fort : pp, p, mf, f, ff. Un crescendo augmente peu à peu, un diminuendo diminue.</p>
<p class="tip">Au piano, la nuance se fait avec le poids du bras, pas en frappant plus vite.</p>`},
{t:'Bilan : clavier, altérations, armures',ex:{type:'mix',parts:[{type:'notes',clef:'fa',pool:FA,w:2},{type:'notes',pool:SOL},{type:'alter',w:2},{type:'armure',kind:'both'},{type:'qcm',qs:Q.tons},{type:'melo',pool:range(0,7),len:4},{type:'tap',level:4}]},n:12,l:()=>`
<p>Vous lisez les deux clés, vous trouvez les touches noires et vous savez nommer une tonalité à partir de son armure.</p>
<p>La dernière semaine s'occupe de ce qui relie les notes entre elles, les intervalles et les accords, puis du jeu lui-même.</p>`},
{t:'Les intervalles',ex:{type:'mix',parts:[{type:'intervK',w:3},{type:'interv',w:2}]},l:()=>`
<p>Un <b>intervalle</b> est la distance entre deux notes. Pour le nommer, comptez les noms de notes, départ et arrivée compris.</p>
<figure>${staff({center:true,gap:44,items:[{d:0,label:'Do'},{d:2,label:'Mi'},{txt:''},{d:0,label:'Do'},{d:4,label:'Sol'}],alt:'Tierce et quinte'})}<figcaption>Do–Mi : trois notes, une tierce. Do–Sol : cinq notes, une quinte.</figcaption></figure>
<p>Seconde (2), tierce (3), quarte (4), quinte (5), sixte (6), septième (7), octave (8).</p>
<p class="tip">Repère visuel : de ligne à ligne voisine, ou d'interligne à interligne voisin, c'est une tierce. Au clavier, on enjambe une touche blanche.</p>
<p>Dans l'exercice, vous jouez les intervalles sur le clavier : une touche est en jaune, vous comptez les touches blanches à partir d'elle, elle comprise, et vous touchez l'arrivée.</p>
<figure>${kfig(0,7,[0,2])}<figcaption>Une tierce au-dessus de Do : Do (1), Ré (2), Mi (3).</figcaption></figure>
<p>Dès aujourd'hui, l'exercice d'oreille vous fait aussi reconnaître des intervalles.</p>`},
{t:'Les accords majeurs et mineurs',ex:{type:'mix',parts:[{type:'accordK',easy:true,w:3},{type:'accordK',root:0,maj:false},{type:'accord',w:2},{type:'qcm',qs:Q.accords,w:2}]},l:()=>`
<p>Un <b>accord</b> est un ensemble de notes jouées en même temps. L'accord parfait en compte trois, empilées de tierce en tierce : la fondamentale, la tierce et la quinte.</p>
<figure>${staff({center:true,gap:60,items:[{d:0,label:'Do'},{d:2,label:'Mi'},{d:4,label:'Sol'}],alt:'Les notes de l\'accord de Do majeur'})}${kfig(0,7,[0,2,4])}<figcaption>Do majeur : Do, Mi, Sol. Une touche sur deux, doigts 1, 3 et 5.</figcaption></figure>
<p>C'est la tierce qui donne la couleur. Avec Mi, l'accord est majeur, clair. Avec Mi bémol, il devient mineur, plus sombre.</p>
<figure>${kfig(0,7,[0,{s:3},4])}<figcaption>Do mineur : Do, Mi bémol, Sol. Seule la note du milieu a changé.</figcaption></figure>

async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return; const id=await user.id(); if(!id)return;
    cloudRef=db.collection('data/users/'+id).doc('progress2');
    const snap=await cloudRef.get(); let changed=false, localExtra=false;
    const data=snap.exists?snap.data():{}, remote=data.done||{};
    for(const k in remote){if(!(k in P.done)||remote[k]>P.done[k]){P.done[k]=remote[k];changed=true;}}
    for(const k in P.done){if(!(k in remote)||P.done[k]>remote[k])localExtra=true;}
    if(!Object.keys(P.err).length&&data.err)P.err=data.err;
    for(const k in (data.best||{})){if(!(P.best[k]>=data.best[k])){P.best[k]=data.best[k];}}
    if(localExtra)save(); else {try{localStorage.setItem(STORE,JSON.stringify(P));}catch(e){}}
    if(changed&&V.view==='home')render();
  }catch(e){}
}

function slidesOf(d){

    <p class="shead"><span>Notes lues</span><span id="sscore">0</span></p>
    <div class="figbox" id="sstaff">${sightStaff(false)}</div>
    <p class="hint" id="shint" style="margin:0 0 10px">Le chrono démarre à votre première réponse.</p>
    ${S.mode==='kbd'?kbd({lo:r[0],hi:r[1],labels:'do',live:true,act:'skey',big:true}):`<div class="choices c4">${NAMES.map((n,i)=>`<button class="choice" data-act="sname" data-i="${i}">${n}</button>`).join('')}</div>`}`;
}
function sightTick(){
  const S=V.s; if(!S||S.over)return; const rem=SDUR-(performance.now()-S.t0)/1000, bar=document.getElementById('sbar'), tm=document.getElementById('stime');
  if(bar)bar.style.width=Math.max(0,rem/SDUR*100)+'%'; if(tm)tm.textContent=Math.max(0,Math.ceil(rem))+'\u00a0s';
  if(rem<=0){ stopSight(); S.over=true; S.record=S.score>(P.best[S.key]||0); if(S.record)P.best[S.key]=S.score; save(); go('sightEnd'); }
}
function sightAnswer(val,el){
  const S=V.s; if(!S||S.over||V.view!=='sight')return; const c=ac();
  if(!S.t0){S.t0=performance.now();S.timer=setInterval(sightTick,200);const hi=document.getElementById('shint');if(hi)hi.textContent='';}
  const d=S.queue[0], ok=S.mode==='kbd'?val===semis(d):val===mod(d,7);
  if(c)tone(S.mode==='kbd'?fS(val):freq(d),c.currentTime+0.01,0.5,ok||S.mode==='kbd'?0.22:0.0001);
  document.querySelectorAll('.kbd .good,.choices .good').forEach(x=>x.classList.remove('good'));
  if(ok){
    S.score++; S.miss=0; S.queue.shift(); pushNote();
    document.getElementById('sstaff').innerHTML=sightStaff(true); document.getElementById('sscore').textContent=S.score;
    const hi=document.getElementById('shint'); if(hi)hi.textContent='';
  } else {
    S.errs++; S.miss++; if(S.miss===1)record({rk:{type:'notes',clef:S.clef,pool:[d],kb:[Math.min(...S.pool),Math.max(...S.pool)]}},false,S.fresh);
    el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),300);
    if(S.miss>=2){
      const g=S.mode==='kbd'?document.querySelector(`.kbd [data-s="${semis(d)}"]`):document.querySelector(`.choices [data-i="${mod(d,7)}"]`); if(g)g.classList.add('good');
      const hi=document.getElementById('shint'); if(hi)hi.textContent=`C'est un ${nameOf(d)}, indiqué en vert.`;
    }
  }
}
function viewSightEnd(){
  const S=V.s, tot=S.score+S.errs, acc=tot?Math.round(S.score/tot*100):0, ec=errCount();
  return `<div class="top"><button class="back" data-act="free">‹ Entraînement</button></div><h2>${S.record?'Nouveau record':'Temps écoulé'}</h2>
    <p class="big">${S.score}<small> note${S.score>1?'s':''} en ${SDUR} s</small></p>
    <p class="plan"><span>Erreurs : ${S.errs}</span><span>Précision : ${acc} %</span><span>Record avec ces réglages : ${P.best[S.key]||S.score} notes</span>${ec?`<span>Les notes ratées reviendront dans vos prochains échauffements</span>`:''}</p>
    <button class="btn" data-act="sight-start">Rejouer</button><button class="btn ghost" data-act="sight-setup">Changer les réglages</button><button class="btn ghost" data-act="home">Retour au programme</button>`;
}
/* ---------- démonstrations du cours ---------- */
const PC=[[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
function exploreKey(s,el){
  const c=ac(); if(c)tone(fS(s),c.currentTime+0.01,0.8);
  const box=el.closest('.explore'); if(!box)return; const pc=PC[mod(s,12)], d=pc[0]+7*Math.floor(s/12), it={d,cls:'hl'}; if(pc[1])it.acc=1;
  box.querySelector('.xs').innerHTML=staff({clef:box.dataset.clef,center:true,items:[it],alt:'Note jouée'});
  box.querySelector('.xname').textContent=nameOf(d)+(pc[1]?` dièse (ou ${nameOf(d+1)} bémol)`:'')+(d===0&&!pc[1]?' du milieu':'');
}
function demoRhythm(toks,svg){
  const c=ac(), t0=(c?c.currentTime:0)+0.12, its=svg?[...svg.querySelectorAll('g.it')].slice(1):[], list=toks.map(T); let t=0;
  const tot=list.reduce((a,it)=>a+beatsOf(it),0); for(let b=0;b<Math.ceil(tot);b++)if(c)click(t0+b*BT,b===0);
  list.forEach((it,i)=>{ const b=beatsOf(it), at=t; if(!it.rest&&c)tone(freq(5),t0+at*BT,Math.max(0.15,b*BT*0.92),0.25);
    setTimeout(()=>{its.forEach(g=>g.classList.remove('hl'));if(its[i])its[i].classList.add('hl');},120+at*BT*1000); t+=b; });
  setTimeout(()=>its.forEach(g=>g.classList.remove('hl')),120+t*BT*1000);
}

/* ---------- déroulé d'une séance ---------- */
let timers=[];
const later=(fn,ms)=>{timers.push(setTimeout(fn,ms));};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];};
function startDay(d){
  const D=DAYS[d-1], segs=[], rev=Object.keys(P.err).reverse().slice(0,3);
  if(d>1)segs.push({name:'Échauffement',n:5,score:0,gen:()=>{
    const k=rev.pop(); if(k){try{const q=makeQ(JSON.parse(k));q.review=true;return q;}catch(e){}}
    return makeQ(DAYS[rnd(d-1)].ex);}});
  const ear=earSpec(d); segs.push({name:'Oreille',n:4,score:0,gen:()=>makeQ(ear)});
  segs.push({name:'Exercice du jour',n:D.n||10,score:0,gen:()=>makeQ(D.ex)});
  startEx(segs,{kind:'day',day:d});
}
function startEx(segs,origin){ ac(); V.ex={segs,origin,fresh:{},si:0,i:0,count:0,total:segs.reduce((a,s)=>a+s.n,0),q:null}; newQ(); }
function newQ(){
  clearTimers(); const E=V.ex; E.q=E.segs[E.si].gen(); E.answered=false; E.ok=false; E.picked=null; E.msg=''; E.pos=0;
  E.tap=E.q.tap?{phase:'idle',taps:[],start:0}:null;
  go('ex'); if(E.q.play){const q=E.q;later(()=>{if(V.ex&&V.ex.q===q)q.play();},250);}
}
function finish(ok,msg){
  const E=V.ex; if(!E||E.answered)return; E.answered=true; E.ok=ok; E.msg=msg||''; if(ok)E.segs[E.si].score++;
  record(E.q,ok,E.fresh); render();
  if(E.q.after&&E.q.choices)E.q.after();
  if(ok&&E.q.onOk)E.q.onOk();
  if(ok)later(next,E.q.onOk?1700:(E.q.after||E.q.kbd?1000:800));
}
function answer(i){ const E=V.ex; if(!E||E.answered||!E.q.choices)return; E.picked=i; finish(i===E.q.a); }
function keyTap(s){
  const E=V.ex; if(!E||E.answered||!E.q.kbd)return; const q=E.q, c=ac(); if(c)tone(fS(s),c.currentTime+0.01,0.7);
  if(q.seq){
    if(s===q.seq[E.pos]){ E.pos++; if(E.pos===q.seq.length){E.picked=s;finish(true);} else {const el=document.getElementById('dots'); if(el)el.textContent=q.seq.map((_,i)=>i<E.pos?'●':'○').join(' ');} }
    else { E.picked=s; finish(false,`La ${ordinal(E.pos+1)} note était un ${q.seqNames[E.pos]}, indiqué en vert.`); }
    return;
  }
  E.picked=s; finish(q.targetMod?mod(s,12)===mod(q.target,12):s===q.target);
}
function padDown(){
  const E=V.ex; if(!E||E.answered||!E.tap)return; const Tp=E.tap, pad=document.getElementById('pad');
  if(Tp.phase==='idle'){startTap();return;}
  const rel=(performance.now()-Tp.start)/1000; if(rel<-0.3)return;
  Tp.taps.push(rel); const c=ac(); if(c)tone(freq(5),c.currentTime+0.005,0.16,0.2);
  if(pad){pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),90);}
}
const BT=60/72;
function startTap(){
  const E=V.ex, q=E.q, Tp=E.tap, c=ac(), tA=(c?c.currentTime:0)+0.15;
  Tp.phase='count'; Tp.taps=[]; Tp.start=performance.now()+150+4*BT*1000;
  for(let i=0;i<8;i++){
    if(c)click(tA+i*BT,i%4===0);
    later(()=>{ if(V.ex!==E||E.q!==q)return; if(i===4)Tp.phase='go';
      const b=document.getElementById('beats'), t=document.getElementById('padtxt');
      if(b)[...b.children].forEach((el,k)=>el.classList.toggle('on',k===i%4));
      if(t)t.textContent=i<4?`Écoutez : ${i+1}`:`À vous : ${i-3}`; },150+i*BT*1000);
  }
  later(()=>{ if(V.ex!==E||E.q!==q)return; evalTap(); },150+8*BT*1000+220);
}
function evalTap(){
  const E=V.ex, exp=[]; let t=0; E.q.tap.toks.map(T).forEach(it=>{if(!it.rest)exp.push(t);t+=beatsOf(it)*BT;});
  const taps=E.tap.taps;
  if(taps.length!==exp.length){finish(false,taps.length?`Il fallait ${exp.length} frappe${exp.length>1?'s':''}, une par note, et vous en avez fait ${taps.length}.`:'Vous n\'avez pas tapé. Après les quatre clics de départ, frappez une fois par note.');return;}
  const offs=taps.map((x,i)=>x-exp[i]), med=median(offs), res=offs.map(x=>x-med); let wi=0; res.forEach((r,i)=>{if(Math.abs(r)>Math.abs(res[wi]))wi=i;});
  if(Math.abs(med)>0.45){finish(false,`Vous êtes parti trop ${med>0?'tard':'tôt'}. La première note tombe sur le premier clic après le décompte.`);return;}
  if(Math.abs(res[wi])>0.17){finish(false,`La ${ordinal(wi+1)} frappe est arrivée trop ${res[wi]>0?'tard':'tôt'}. Comptez les temps à voix haute.`);return;}
  finish(true,'Bien en place.');
}
function next(){
  clearTimers(); const E=V.ex; if(!E||!E.answered)return; E.i++; E.count++;
  if(E.i>=E.segs[E.si].n){E.si++;E.i=0;}
  if(E.si<E.segs.length){newQ();return;}
  E.si=E.segs.length-1;
  if(E.origin.kind==='day'){const M=E.segs[E.si], k='d'+E.origin.day, pct=Math.round(M.score/M.n*100); if(!(k in P.done)||pct>P.done[k])P.done[k]=pct;}
  save(); go('result');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return; const a=el.dataset.act;
  if(a==='home'||a==='free'){clearTimers();stopSight();go(a);}
  else if(a==='day')go('day',{day:+el.dataset.day,slide:0});
  else if(a==='slide')go('day',{slide:+el.dataset.to});
  else if(a==='xkey')exploreKey(+el.dataset.s,el);
  else if(a==='play-r'){const f=el.closest('figure');demoRhythm(el.dataset.r.split(','),f?f.querySelector('svg'):null);}
  else if(a==='sight-setup'){stopSight();go('sightSetup');}
  else if(a==='sc'){const k=el.dataset.k,v=el.dataset.v;V.sc[k]=k==='lvl'?+v:v;render();}
  else if(a==='sight-start')startSight();
  else if(a==='sight-bonus'){const d=V.ex.origin.day;V.sc={clef:'sol',lvl:d<4?0:d<5?1:2,mode:'kbd'};startSight();}
  else if(a==='sight-quit'){stopSight();save();go('sightSetup');}
  else if(a==='skey')sightAnswer(+el.dataset.s,el);
  else if(a==='sname')sightAnswer(+el.dataset.i,el);
  else if(a==='start-day')startDay(V.day);
  else if(a==='start-free'){const i=+el.dataset.i;startEx([{name:FREE[i][0],n:10,score:0,gen:()=>makeQ(FREE[i][2])}],{kind:'free',i});}
  else if(a==='answer')answer(+el.dataset.i);
  else if(a==='key')keyTap(+el.dataset.s);
  else if(a==='next')next();
  else if(a==='replay'){if(V.ex&&V.ex.q.play)V.ex.q.play();}
  else if(a==='quit'){clearTimers();save();const o=V.ex.origin;V.ex=null;o.kind==='day'?go('day',{day:o.day,slide:99}):go('free');}
  else if(a==='reset'){V.confirmReset=true;render();}
  else if(a==='reset-no'){V.confirmReset=false;render();}
  else if(a==='reset-yes'){P={done:{},err:{},best:{}};save();go('home');}
});
document.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('#pad')){e.preventDefault();padDown();} });
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return; const t=e.target; if(!t.matches)return;
  if(t.matches('#pad')){e.preventDefault();if(!e.repeat)padDown();}
  else if(t.matches('g[data-act]')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
render(); initCloud();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
</script>
</body>
